name: Docs site

# Publishes https://ishan-18.github.io/pagepal/ with GitHub Pages:
#   /ui/     the website and documentation (from ishan-18/pagepal.github.io),
#            built against this commit of the package
#   /demo/   the package's own demo pages
#   /        redirects to /ui/
#
# Runs on pushes here, on demand, and when the website repository asks for a
# rebuild (repository_dispatch "website-updated").
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [website-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Same layout as on a dev machine: the website depends on "file:../pagepal".
      - uses: actions/checkout@v4
        with:
          path: pagepal
      - uses: actions/checkout@v4
        with:
          repository: ishan-18/pagepal.github.io
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            pagepal/package-lock.json
            site/package-lock.json

      - name: Build the package
        working-directory: pagepal
        run: npm ci && npm run build

      - name: Build the website for /pagepal/ui
        working-directory: site
        run: npm ci && npm run build && npm run check:links
        env:
          BASE_PATH: /pagepal/ui
          SITE_URL: https://ishan-18.github.io

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r pagepal/dist pagepal/demo _site/
          cp -r site/dist _site/ui
          # GitHub Pages serves /404.html from the site root for any missing page.
          cp site/dist/404.html _site/404.html
          printf '<!doctype html><meta charset="utf-8"><title>pagepal</title><meta http-equiv="refresh" content="0; url=ui/"><link rel="canonical" href="https://ishan-18.github.io/pagepal/ui/"><a href="ui/">pagepal</a>' > _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
